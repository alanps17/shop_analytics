version: 2

models:
  - name: fct_order_items
    columns:
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_unique_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_date
        tests:
          - not_null
      - name: price
        tests:
          - not_null

  - name: agg_revenue_daily
    columns:
      - name: order_date
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null

  - name: dim_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: category
        tests:
          - not_null

  - name: dim_customers
    columns:
      - name: customer_unique_id
        tests:
          - unique
          - not_null
      - name: orders_count
        tests:
          - not_null            

  - name: agg_revenue_by_state
    columns:
      - name: state
        tests:
          - not_null
      - name: month
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null 

  - name: agg_sales
    columns:
      - name: order_date
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: category
        tests:
          - not_null
      - name: revenue
        tests:
          - not_null       